name: enterprise-ai-ops-assistant

services:
  chromadb:
    image: ${CHROMA_IMAGE:-chromadb/chroma:1.5.3}
    container_name: aiops-chromadb
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: ${ANONYMIZED_TELEMETRY:-False}
    ports:
      - "${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - aiops

  ticket-mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    container_name: aiops-ticket-mcp
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MCP_SERVER: ticket
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HEALTHCHECK_URL: http://127.0.0.1:8101/health
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aiops

  document-mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    container_name: aiops-document-mcp
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MCP_SERVER: document
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HEALTHCHECK_URL: http://127.0.0.1:8102/health
    ports:
      - "8102:8102"
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aiops

  log-mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    container_name: aiops-log-mcp
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MCP_SERVER: log
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HEALTHCHECK_URL: http://127.0.0.1:8103/health
    ports:
      - "8103:8103"
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aiops

  fastapi:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: aiops-fastapi
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      HEALTHCHECK_URL: http://127.0.0.1:8000/health
    ports:
      - "8000:8000"
    depends_on:
      chromadb:
        condition: service_healthy
      ticket-mcp:
        condition: service_healthy
      document-mcp:
        condition: service_healthy
      log-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aiops

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    container_name: aiops-streamlit
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STREAMLIT_API_BASE_URL: http://fastapi:8000
      HEALTHCHECK_URL: http://127.0.0.1:8501/_stcore/health
    ports:
      - "8501:8501"
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - aiops

networks:
  aiops:
    driver: bridge

volumes:
  chroma_data:
