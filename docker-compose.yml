name: enterprise-ai-ops-assistant

services:
  mongodb:
    image: ${MONGODB_IMAGE:-mongo:8.0}
    container_name: aiops-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aiops

  mongo-ingest:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    container_name: aiops-mongo-ingest
    restart: "no"
    env_file:
      - .env.docker
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
    command:
      - sh
      - -c
      - >-
        if [ "$${MONGODB_REQUIRE_EMBEDDINGS:-false}" = "true" ];
        then python scripts/ingest_mongodb_documents.py --require-embeddings;
        else python scripts/ingest_mongodb_documents.py;
        fi
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - aiops

  ticket-mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    container_name: aiops-ticket-mcp
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MCP_SERVER: ticket
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HEALTHCHECK_URL: http://127.0.0.1:8101/health
    ports:
      - "8101:8101"
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aiops

  document-mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    container_name: aiops-document-mcp
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MCP_SERVER: document
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017}
      HEALTHCHECK_URL: http://127.0.0.1:8102/health
    ports:
      - "8102:8102"
    depends_on:
      mongo-ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aiops

  log-mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    container_name: aiops-log-mcp
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      MCP_SERVER: log
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HEALTHCHECK_URL: http://127.0.0.1:8103/health
    ports:
      - "8103:8103"
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aiops

  fastapi:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: aiops-fastapi
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MCP_CLIENT_MODE: http
      MCP_ALLOW_LOCAL_FALLBACK: "false"
      TICKET_MCP_URL: http://ticket-mcp:8101/mcp
      DOCUMENT_MCP_URL: http://document-mcp:8102/mcp
      LOG_MCP_URL: http://log-mcp:8103/mcp
      HEALTHCHECK_URL: http://127.0.0.1:8000/health
    ports:
      - "8000:8000"
    depends_on:
      ticket-mcp:
        condition: service_healthy
      document-mcp:
        condition: service_healthy
      log-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - aiops

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    container_name: aiops-streamlit
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      STREAMLIT_API_BASE_URL: http://fastapi:8000
      HEALTHCHECK_URL: http://127.0.0.1:8501/_stcore/health
    ports:
      - "8501:8501"
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - aiops

networks:
  aiops:
    driver: bridge

volumes:
  mongodb_data:
